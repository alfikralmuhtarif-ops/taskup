# TaskUp — reverse proxy and static hosting.
#
# TLS is terminated here. The API container is never published to the host, so this
# file is the only route in; that is what makes clearing KnownProxies in Program.cs
# safe (see the UseForwardedHeaders comment there).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # Only the API here. The apex and www are handled by site.conf, which serves the
    # landing page over plain HTTP until they have DNS and a certificate of their own —
    # redirecting them to https now would send visitors to a name with no certificate.
    server_name api.taskupapp.net;

    # Certbot's HTTP-01 challenge must stay on plain HTTP.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── API ───────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.taskupapp.net;

    ssl_certificate     /etc/letsencrypt/live/api.taskupapp.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.taskupapp.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Attachments go through POST /files; the default 1m would reject most photos.
    client_max_body_size 25m;

    # Admin panel, served from the API's own origin. Same-origin means the panel's
    # calls to /admin/* involve no CORS at all. It lives here rather than on
    # admin.taskupapp.net only because that name has no DNS record yet; moving it
    # later is a rebuild with --base=/ plus its own vhost.
    location /panel/ {
        alias /usr/share/nginx/html/panel/;
        try_files $uri $uri/ /panel/index.html;
    }
    location = /panel { return 301 /panel/; }

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # SignalR holds a long-lived WebSocket. Without the Upgrade/Connection pair
        # the handshake is proxied as a normal request and live chat silently dies;
        # without the long read timeout nginx severs an idle connection after 60s.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # These are what UseForwardedHeaders reads. X-Forwarded-Proto is the one that
        # stops UseHttpsRedirection from looping; X-Forwarded-For is what the per-IP
        # OTP rate limiter needs to be meaningful.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
