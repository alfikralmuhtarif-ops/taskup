# First-deploy config: plain HTTP only.
#
# nginx refuses to start if `ssl_certificate` points at a file that does not exist,
# but Let's Encrypt cannot issue that file until it can reach an HTTP endpoint on
# this domain — a deadlock on a brand-new server. This config breaks it: it serves
# the ACME challenge, and proxies the API over HTTP so the stack can be smoke-tested
# before a certificate exists. deploy.sh swaps in available/full.conf once the
# certificate is issued.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name api.taskupapp.net taskupapp.net www.taskupapp.net app.taskupapp.net admin.taskupapp.net;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Deliberately "http" here: during bootstrap there is no TLS in front, so
        # claiming https would make UseHttpsRedirection bounce every request.
        proxy_set_header X-Forwarded-Proto http;
    }
}
