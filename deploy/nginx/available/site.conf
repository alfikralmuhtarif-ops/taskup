# Public landing page (taskupapp.net).
#
# Also the default_server for port 80, so the site answers on the bare IP too —
# which is how it can be previewed before the apex has any DNS record. Once
# taskupapp.net and www resolve here, issue a certificate covering both and add a
# 443 block; only then should this start redirecting to https.

server {
    listen 80 default_server;
    server_name taskupapp.net www.taskupapp.net _;

    root /usr/share/nginx/html/site;
    index index.html;

    # Kept on plain HTTP for the future certificate request.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Hashed font/image assets are safe to cache hard; the HTML must not be.
    location /fonts/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location ~* \.(png|svg|ico|woff2)$ { expires 30d; add_header Cache-Control "public"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Admin panel, reachable without "api" in the address. It lives here as well as
    # on the API vhost because admin.taskupapp.net has no DNS record yet and only the
    # domain owner can create one.
    location /panel/ {
        alias /usr/share/nginx/html/panel/;
        try_files $uri $uri/ /panel/index.html;
    }
    location = /panel { return 301 /panel/; }

    # The panel talks to the API cross-origin from here, so send it to the name that
    # has the certificate.
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_set_header Host              api.taskupapp.net;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri $uri/ /index.html; }
}
