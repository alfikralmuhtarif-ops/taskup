# NOTE: these vhosts reference /etc/letsencrypt/live/taskupapp.net/, which only
# exists once a certificate covering the apex, www, app and admin names has been
# issued. The backend deploy issues one for api.taskupapp.net alone.
#
# Frontend vhosts — enabled only once the SPA bundles exist (compose profile
# "frontend" builds them). Kept out of the API config so a backend-only deploy
# does not serve two empty document roots.

# ── User app + admin panel (SPA: unknown paths fall back to index.html) ────────
server {
    listen 443 ssl;
    http2 on;
    server_name app.taskupapp.net;
    ssl_certificate     /etc/letsencrypt/live/taskupapp.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskupapp.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html/app;
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.taskupapp.net;
    ssl_certificate     /etc/letsencrypt/live/taskupapp.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskupapp.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html/admin;
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
