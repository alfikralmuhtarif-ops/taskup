# TaskUp — added by the TaskUp deployment, separate from the panel's own sites.
#
# This host's aaPanel nginx owns ports 80/443 and already serves 3s4all.com. The
# TaskUp stack therefore listens on 127.0.0.1:8080 (Docker) and this file forwards
# only the taskupapp.net names to it. Nothing here touches any other site: remove
# this single file and reload to undo it completely.

server {
    listen 80;
    server_name api.taskupapp.net taskupapp.net www.taskupapp.net admin.taskupapp.net;

    # Certificate renewal reaches port 80, which this nginx owns — so the challenge
    # must be served from here, not from the container, or renewal fails silently
    # in ~60 days.
    location /.well-known/acme-challenge/ { root /opt/taskup/deploy/certbot-webroot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.taskupapp.net;

    ssl_certificate     /opt/taskup/deploy/letsencrypt/live/api.taskupapp.net/fullchain.pem;
    ssl_certificate_key /opt/taskup/deploy/letsencrypt/live/api.taskupapp.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location / {
        # To 8443, not 8080: the container's port-80 vhost answers 301-to-https for
        # this name, so proxying there produced a redirect loop. Going to its TLS
        # port keeps the hop encrypted as well.
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name api.taskupapp.net;
        proxy_http_version 1.1;

        # SignalR holds a long-lived WebSocket; without these the live chat dies.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
